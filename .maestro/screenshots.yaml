# Regenerates docs/screenshots/*. Run from the repo root with Metro on :8090:
#   maestro test .maestro/screenshots.yaml
appId: host.exp.Exponent
env:
  APP_URL: exp://127.0.0.1:8090?__expo_disable_fab=1
  SHOTS: docs/screenshots
---
- stopApp
- openLink: ${APP_URL}
- extendedWaitUntil:
    visible: 'Showing 283 of 283 breeds'
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: ${SHOTS}/${THEME}-list

- tapOn:
    id: filters-button
- tapOn: 'Toy'
- tapOn: 'Hypoallergenic yes'
- takeScreenshot: ${SHOTS}/${THEME}-filters-sheet
- tapOn:
    id: apply-filters
- waitForAnimationToEnd
- takeScreenshot: ${SHOTS}/${THEME}-filters-applied
- tapOn: 'Clear search and filters'

- tapOn: 'Affenpinscher.*'
- tapOn:
    id: tab-Traits
- scrollUntilVisible:
    element: 'Energy: .*'
    direction: DOWN
- waitForAnimationToEnd
- takeScreenshot: ${SHOTS}/${THEME}-detail-traits
- tapOn:
    id: tab-Gallery
- scrollUntilVisible:
    element: 'Photo by.*'
    direction: DOWN
- waitForAnimationToEnd
- takeScreenshot: ${SHOTS}/${THEME}-detail-gallery
