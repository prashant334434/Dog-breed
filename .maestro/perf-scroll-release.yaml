# Release-build scroll run used for PERFORMANCE.md memory sampling: fling through all 283 rows and back.
appId: ai.tripare.dogbreeds
# Launch the app first (xcrun simctl launch booted ai.tripare.dogbreeds) so a sampler can attach to its PID.
---
- launchApp:
    stopApp: false # bring to front without restarting, so the sampled PID stays the same
- extendedWaitUntil:
    visible: 'Showing 283 of 283 breeds'
    timeout: 20000
- repeat:
    times: 28
    commands:
      - swipe:
          start: 50%, 85%
          end: 50%, 15%
          duration: 120
- takeScreenshot: release-end-of-list
- repeat:
    times: 30
    commands:
      - swipe:
          start: 50%, 15%
          end: 50%, 85%
          duration: 100
