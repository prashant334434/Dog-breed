# Critical path: list loads -> search (incl. other_names) -> detail tabs -> gallery attribution -> filters.
# Expo Go:   maestro test .maestro/critical-flow.yaml
# Dev build: maestro test -e APP_ID=ai.tripare.dogbreeds -e APP_URL=dogbreeds:// .maestro/critical-flow.yaml
appId: ${APP_ID || 'host.exp.Exponent'}
env:
  APP_URL: ${APP_URL || 'exp://127.0.0.1:8090'}
---
- stopApp
- openLink: ${APP_URL}
- extendedWaitUntil:
    visible: 'Showing 283 of 283 breeds'
    timeout: 60000

# Search matches other_names ("Monkey Terrier" -> Affenpinscher), debounced
- tapOn:
    id: search-input
- inputText: monkey terrier
- extendedWaitUntil:
    visible: 'Showing 1 of 283 breeds'
    timeout: 5000
- tapOn: 'Affenpinscher.*'

# Detail tabs
- assertVisible: 'Life span: 14–16 years'
- tapOn:
    id: tab-Traits
- assertVisible: 'Energy: 3 out of 5'
- scrollUntilVisible:
    element: 'Good With Children: 3 out of 5'
    direction: DOWN
- tapOn:
    id: tab-Gallery
- scrollUntilVisible:
    element: 'Photo by.*'
    direction: DOWN
- assertVisible: 'License:.*'
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: 'Breeds' # header back button
- runFlow:
    when:
      platform: Android
    commands:
      - back

# Filters: Toy group + hypoallergenic narrows the list
- tapOn: 'Clear search and filters'
- tapOn:
    id: filters-button
- tapOn: 'Toy'
- tapOn: 'Hypoallergenic yes'
- tapOn:
    id: apply-filters
- assertVisible: 'Showing [0-9]+ of 283 breeds'
- assertNotVisible: 'Showing 283 of 283 breeds'
- assertVisible: 'Filters, 2 active'
